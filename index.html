<!-- =========================================
     PTIS DIGITAL FORM ASSISTANT
========================================= -->

<!-- FLOATING ASSISTANT BUTTON -->

<button
    id="ptisAssistantButton"
    type="button"
    aria-label="Buka PTIS Digital Form Assistant"
>

    <div class="ptis-assistant-avatar">

        <img
            src="assets/ptis-assistant.png"
            alt="PTIS Digital Form Assistant"
        >

        <span class="ptis-assistant-online"></span>

    </div>

    <div class="ptis-assistant-label">

        <span class="ptis-assistant-help">
            Selamat Datang 👋
        </span>

        <span class="ptis-assistant-click">
            Klik saya
        </span>

    </div>

</button>


<!-- ASSISTANT PANEL -->

<div
    id="ptisAssistantPanel"
    class="ptis-assistant-panel"
    aria-hidden="true"
>

    <!-- HEADER -->

    <div class="ptis-assistant-header">

        <div class="ptis-assistant-header-info">

            <img
                src="assets/ptis-assistant.png"
                alt="PTIS Assistant"
                class="ptis-assistant-header-avatar"
            >

            <div>

                <h3>
                    PTIS Digital Form Assistant
                </h3>

                <p>
                    <span class="ptis-status-dot"></span>
                    Online • Sedia Membantu
                </p>

            </div>

        </div>


        <button
            id="ptisAssistantClose"
            type="button"
            aria-label="Tutup Assistant"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>


    <!-- EDCAFE CHATBOT -->

    <div class="ptis-assistant-content">

        <iframe
            src="https://app.edcafe.ai/chatbots/6a7a6a9d1a30f33122eb1f80"
            title="PTIS Digital Form Assistant"
            allow="microphone"
            loading="lazy"
        ></iframe>

    </div>

</div>
