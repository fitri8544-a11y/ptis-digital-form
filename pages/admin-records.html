<div class="max-w-[1650px] mx-auto px-10 py-8 space-y-8">

    <!-- ================= HEADER ================= -->

    <div class="relative overflow-hidden rounded-3xl border border-slate-700 bg-gradient-to-br from-slate-900 via-slate-950 to-black p-8 shadow-2xl">

        <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-purple-500/10 blur-3xl"></div>

        <div class="absolute -bottom-24 -left-24 w-72 h-72 rounded-full bg-cyan-500/10 blur-3xl"></div>

        <div class="relative z-10">

            <div class="inline-flex items-center gap-3 px-5 py-2 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 font-bold">

                📄 RECORD CENTER

            </div>

            <h1 class="mt-6 text-5xl font-black text-white">

                Semua Rekod Digital Forms

            </h1>

            <p class="mt-3 text-lg text-slate-400 max-w-3xl">

                Senarai keseluruhan rekod Digital Forms yang dihantar oleh pengguna serta tindakan pentadbiran.

            </p>

        </div>

    </div>

    <!-- ================= SEARCH ================= -->

    <div class="relative">

        <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-500"></i>

        <input
        id="recordSearch"
        type="text"

        placeholder="Cari nama, email atau nombor rekod..."

        class="w-full
        rounded-3xl
        bg-slate-900
        border
        border-slate-700
        pl-14
        pr-6
        py-5
        text-white
        placeholder:text-slate-500
        focus:border-purple-500
        focus:ring-4
        focus:ring-purple-500/20
        outline-none
        transition">

    </div>

    <!-- ================= TABLE ================= -->

    <div class="overflow-hidden rounded-3xl border border-slate-700 bg-slate-900 shadow-2xl">

        <div class="overflow-x-auto">

            <table class="w-full">

                <thead class="bg-slate-800">

                    <tr>

                        <th class="p-5 text-left text-slate-300">

                            Borang

                        </th>

                        <th class="p-5 text-left text-slate-300">

                            No Rekod

                        </th>

                        <th class="p-5 text-left text-slate-300">

                            Pengguna

                        </th>

                        <th class="p-5 text-left text-slate-300">

                            Tarikh

                        </th>

                        <th class="p-5 text-center text-slate-300">

                            Tindakan

                        </th>

                    </tr>

                </thead>

                <tbody
                id="adminRecordTable">

                </tbody>

            </table>

        </div>

    </div>

</div>
