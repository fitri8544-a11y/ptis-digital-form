<div class="space-y-6">

    <!-- HEADER -->

    <div class="border-b border-slate-700 pb-5">

        <div class="inline-flex
        items-center
        gap-2
        px-4
        py-2
        rounded-full
        bg-purple-500/10
        text-purple-400
        font-bold">

            📄 RECORD CENTER

        </div>

        <h1 class="text-4xl font-black text-white mt-4">

            Semua Rekod

        </h1>

        <p class="text-slate-400 mt-2">

            Semua rekod yang dihantar oleh pengguna.

        </p>

    </div>

    <!-- SEARCH -->

    <input
    id="recordSearch"
    type="text"

    placeholder="Cari nama, email atau nombor rekod..."

    class="w-full
    rounded-2xl
    bg-slate-800
    border
    border-slate-700
    px-5
    py-4
    text-white">

    <!-- TABLE -->

    <div
    class="overflow-x-auto
    rounded-3xl
    border
    border-slate-700">

        <table class="w-full">

            <thead
            class="bg-slate-800">

                <tr>

                    <th class="p-4 text-left">

                        Borang

                    </th>

                    <th class="p-4 text-left">

                        No Rekod

                    </th>

                    <th class="p-4 text-left">

                        Pengguna

                    </th>

                    <th class="p-4 text-left">

                        Tarikh

                    </th>

                    <th class="p-4 text-center">

                        Tindakan

                    </th>

                </tr>

            </thead>

            <tbody
            id="adminRecordTable">

            </tbody>

        </table>

    </div>

</div>
