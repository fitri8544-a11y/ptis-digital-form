<div class="space-y-6">

    <!-- HEADER -->

    <div class="border-b border-slate-700 pb-5">

        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-cyan-500/10 text-cyan-400 font-bold">

            👥 USER MANAGEMENT

        </div>

        <h1 class="text-4xl font-black text-white mt-4">

        </p>

    </div>

        <input

                    <th class="p-4 text-left text-slate-300">

                    <th class="p-4 text-center text-slate-300">

                    <th class="p-4 text-center text-slate-300">
