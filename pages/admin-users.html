<!-- ==========================================
     USER MANAGEMENT
========================================== -->

<div class="max-w-[1650px] mx-auto px-10 py-8 space-y-10">

    <!-- ================= HEADER ================= -->

    <div class="relative overflow-hidden rounded-3xl border border-slate-700 bg-gradient-to-br from-slate-900 via-slate-950 to-black p-8 shadow-2xl">

        <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-cyan-500/10 blur-3xl"></div>

        <div class="absolute -bottom-20 -left-20 w-72 h-72 rounded-full bg-emerald-500/10 blur-3xl"></div>

        <div class="relative z-10">

            <div class="inline-flex items-center gap-3 px-5 py-2 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-300 font-bold">

                👥 USER MANAGEMENT

            </div>

            <h1 class="mt-6 text-5xl font-black tracking-tight text-white">

                Pengurusan Pengguna

            </h1>

            <p class="mt-3 text-lg text-slate-400 max-w-3xl">

                Pantau semua pengguna yang pernah mengakses PTIS Digital Form,
                status akaun, peranan serta rekod log masuk terakhir.

            </p>

        </div>

    </div>

    <!-- ================= KPI ================= -->

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8">

        <!-- JUMLAH PENGGUNA -->

        <div class="relative overflow-hidden rounded-3xl border border-cyan-500/20 bg-gradient-to-br from-slate-900 to-slate-950 p-7 shadow-xl">

            <div class="absolute -top-8 -right-8 w-28 h-28 rounded-full bg-cyan-500/10 blur-2xl"></div>

            <div class="relative z-10 flex justify-between items-center">

                <div>

                    <p class="text-slate-400 text-sm font-semibold uppercase tracking-wider">

                        Jumlah Pengguna

                    </p>

                    <h2
                    id="totalUserCount"
                    class="mt-4 text-5xl font-black text-white">

                        0

                    </h2>

                </div>

                <div class="w-16 h-16 rounded-2xl bg-cyan-500/15 flex items-center justify-center text-3xl">

                    👥

                </div>

            </div>

        </div>

        <!-- ADMIN -->

        <div class="relative overflow-hidden rounded-3xl border border-amber-500/20 bg-gradient-to-br from-slate-900 to-slate-950 p-7 shadow-xl">

            <div class="absolute -top-8 -right-8 w-28 h-28 rounded-full bg-amber-500/10 blur-2xl"></div>

            <div class="relative z-10 flex justify-between items-center">

                <div>

                    <p class="text-slate-400 text-sm font-semibold uppercase tracking-wider">

                        Administrator

                    </p>

                    <h2
                    id="totalAdminCount"
                    class="mt-4 text-5xl font-black text-white">

                        0

                    </h2>

                </div>

                <div class="w-16 h-16 rounded-2xl bg-amber-500/15 flex items-center justify-center text-3xl">

                    👑

                </div>

            </div>

        </div>

        <!-- GURU -->

        <div class="relative overflow-hidden rounded-3xl border border-emerald-500/20 bg-gradient-to-br from-slate-900 to-slate-950 p-7 shadow-xl">

            <div class="absolute -top-8 -right-8 w-28 h-28 rounded-full bg-emerald-500/10 blur-2xl"></div>

            <div class="relative z-10 flex justify-between items-center">

                <div>

                    <p class="text-slate-400 text-sm font-semibold uppercase tracking-wider">

                        Guru

                    </p>

                    <h2
                    id="totalTeacherCount"
                    class="mt-4 text-5xl font-black text-white">

                        0

                    </h2>

                </div>

                <div class="w-16 h-16 rounded-2xl bg-emerald-500/15 flex items-center justify-center text-3xl">

                    🎓

                </div>

            </div>

        </div>

        <!-- AKTIF -->

        <div class="relative overflow-hidden rounded-3xl border border-violet-500/20 bg-gradient-to-br from-slate-900 to-slate-950 p-7 shadow-xl">

            <div class="absolute -top-8 -right-8 w-28 h-28 rounded-full bg-violet-500/10 blur-2xl"></div>

            <div class="relative z-10 flex justify-between items-center">

                <div>

                    <p class="text-slate-400 text-sm font-semibold uppercase tracking-wider">

                        Pengguna Aktif

                    </p>

                    <h2
                    id="activeUserCount"
                    class="mt-4 text-5xl font-black text-white">

                        0

                    </h2>

                </div>

                <div class="w-16 h-16 rounded-2xl bg-violet-500/15 flex items-center justify-center text-3xl">

                    🟢

                </div>

            </div>

        </div>

    </div>

    <!-- ================= SEARCH ================= -->

    <div class="relative">

        <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-500"></i>

        <input
        id="userSearch"
        type="text"
        placeholder="Cari nama, email atau peranan pengguna..."

        class="w-full rounded-3xl
        bg-slate-900
        border border-slate-700
        pl-14 pr-6 py-5
        text-white
        placeholder:text-slate-500
        focus:border-cyan-500
        focus:ring-4
        focus:ring-cyan-500/20
        outline-none
        transition">

    </div>

    <!-- ================= TABLE ================= -->

    <div class="overflow-hidden rounded-3xl border border-slate-700 bg-slate-900 shadow-2xl">

        <div class="overflow-x-auto">

            <table class="w-full">

                <thead class="bg-slate-800">

                    <tr>

                        <th class="p-5 text-left text-slate-300 w-20">

                            Avatar

                        </th>

                        <th class="p-5 text-left text-slate-300">

                            Nama

                        </th>

                        <th class="p-5 text-left text-slate-300">

                            Email

                        </th>

                        <th class="p-5 text-center text-slate-300">

                            Peranan

                        </th>

                        <th class="p-5 text-center text-slate-300">

                            Login Terakhir

                        </th>

                        <th class="p-5 text-center text-slate-300 w-40">

                            Tindakan

                        </th>

                    </tr>

                </thead>

                <tbody
                id="userTable">

                </tbody>

            </table>

        </div>

    </div>

</div>
